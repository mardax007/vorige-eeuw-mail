[workspace]
resolver = "3"
members = ["crates/vem-core", "src-tauri"]

# outlook-pst 1.2.0 with three fixes that let it read real PST files it refused; see
# vendor/outlook-pst/VEM-PATCHES.md.
[patch.crates-io]
outlook-pst = { path = "vendor/outlook-pst" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: import catches a panic in a reader crate on a damaged old mail file.
strip = true
