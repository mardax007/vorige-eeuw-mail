# Tests on every push and pull request: the Rust core (with the local GreenMail test server,
# never a real mailbox) and the screens.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Screens
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Start the local test mail server (GreenMail)
        shell: pwsh
        run: |
          $jar = "$env:RUNNER_TEMP\greenmail.jar"
          Invoke-WebRequest https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/2.1.3/greenmail-standalone-2.1.3.jar -OutFile $jar
          Start-Process java -ArgumentList @(
            '-Dgreenmail.setup.test.all', '-Dgreenmail.hostname=127.0.0.1',
            '-Dgreenmail.users=jan:geheim@example.test,piet:geheim@example.test',
            '-Dgreenmail.users.login=email', '-jar', $jar) -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-NetConnection 127.0.0.1 -Port 3993 -WarningAction SilentlyContinue).TcpTestSucceeded) { exit 0 }
            Start-Sleep 2
          }
          throw 'GreenMail did not start'

      # The rescue tool for damaged Outlook files (readpst), so its real test runs too.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-libpst

      # Public real PST and DBX files (not kept in the repository), so the import tests run on
      # real data and a lost outlook-pst patch is caught. The passworded PST's check matches a
      # known collision string (CRC-32, so not its real password); see docs/PROGRESS.md.
      - name: Fetch real import samples
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\pst"
          New-Item -ItemType Directory -Force "$dir", "$env:RUNNER_TEMP\dbx" | Out-Null
          $files = @{
            "$dir\enron.pst"      = "https://github.com/epfromer/pst-extractor/raw/HEAD/src/__tests__/testdata/enron.pst"
            "$dir\passworded.pst" = "https://github.com/rjohnsondev/java-libpst/raw/HEAD/src/test/resources/passworded.pst"
            "$dir\dist-list.pst"  = "https://github.com/rjohnsondev/java-libpst/raw/HEAD/src/test/resources/dist-list.pst"
            "$dir\Outlook.pst"    = "https://github.com/aspose-email/Aspose.Email-for-Java/raw/HEAD/Examples/src/main/resources/outlook/Outlook.pst"
            "$env:RUNNER_TEMP\dbx\Inbox.dbx" = "https://github.com/tibordp/fillyfoal/raw/HEAD/tests/fixtures/synthetic/outlook-express-dbx/Inbox.dbx"
          }
          foreach ($f in $files.GetEnumerator()) { Invoke-WebRequest $f.Value -OutFile $f.Key }

      - name: Rust core
        env:
          VEM_READPST: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\readpst.exe
          VEM_REAL_PST_DIR: ${{ runner.temp }}\pst
          VEM_REAL_PST_PASSWORD: 3tpi5t
          VEM_REAL_DBX: ${{ runner.temp }}\dbx\Inbox.dbx
          VEM_REAL_DBX_ITEMS: '2'
          VEM_RESCUE_PST: ${{ runner.temp }}\pst\enron.pst
        run: cargo test -p vem-core --features test-support

      - name: Rescue tool collects
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          VEM_RESCUE_REQUIRED: '1'
        run: node scripts/rescue-tool.mjs

      - name: Tauri shell compiles
        run: cargo check -p vem
