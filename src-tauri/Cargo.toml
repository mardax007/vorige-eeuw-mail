[package]
name = "vem"
version = "0.1.0"
description = "Vorige Eeuw Mail"
authors = ["Martijn"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (cargo issue 8519, Windows).
name = "vem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vem-core = { path = "../crates/vem-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# Windows only: one running copy, starting with Windows, silent signed updates. Android has
# none of these (phase 5: updates there go through Android's own install screen).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
