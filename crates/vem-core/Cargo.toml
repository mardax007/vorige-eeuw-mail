[package]
name = "vem-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Mail logic for Vorige Eeuw Mail, without any Tauri dependency"

[dependencies]
ammonia = "4.2.5"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
html2text = "0.17.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
mail-builder = "2.0.1"
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
outlook-pst = "1.2.0"
quick-xml = "0.42.0"
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[features]
# Only for integration tests against the local throwaway test server. Never enabled by the app.
test-support = []
